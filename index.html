<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megaphone</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="megaphone.png" type="image/png">
</head>
<body>
    <form id="new-post-form">
        <label for="post-body">Post body:</label>
        <input type="text" name="body" id="post-body">
        <label for="post-user">Username:</label>
        <input type="text" name="user" id="post-user">
        <button type="submit">POST</button>
    </form>
    <ul id="all-posts"></ul>  //to display all posts from the database
</body>
</html>
